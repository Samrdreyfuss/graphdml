# Local Neo4j for graphdml development and the demo.
#   docker compose up -d        # browser: http://localhost:7474  (neo4j / graphdml-demo)
#   Ports clash with another Neo4j? GRAPHDML_NEO4J_HTTP_PORT=7476 GRAPHDML_NEO4J_BOLT_PORT=7689 docker compose up -d
#   python -m graphdml.demo     # seed a dataset, estimate effects, write results back
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphdml-neo4j
    ports:
      - "${GRAPHDML_NEO4J_HTTP_PORT:-7474}:7474"   # browser
      - "${GRAPHDML_NEO4J_BOLT_PORT:-7687}:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/graphdml-demo
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - graphdml-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  graphdml-neo4j-data:
