[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "graphdml"
version = "0.1.0.dev0"
description = "Double machine learning for causal effects on networks: direct and peer effects with valid confidence intervals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sam Dreyfuss" }]
keywords = [
    "causal inference",
    "double machine learning",
    "networks",
    "interference",
    "spillover",
    "peer effects",
    "neo4j",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.14"]
gnn = ["torch>=2.2", "torch-geometric>=2.5"]
viz = ["matplotlib>=3.7"]
validation = ["statsmodels>=0.14", "doubleml>=0.9", "joblib>=1.3", "tabulate>=0.9"]
dev = [
    "graphdml[neo4j]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "graphdml[validation]",
]

[project.urls]
Homepage = "https://github.com/Samrdreyfuss/graphdml"
Paper = "https://proceedings.mlr.press/v258/khatami25a.html"

[tool.hatch.build.targets.wheel]
packages = ["src/graphdml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: Monte Carlo validation gates (run with `pytest -m slow`)",
]
filterwarnings = ["ignore::graphdml.exceptions.GraphDMLWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
