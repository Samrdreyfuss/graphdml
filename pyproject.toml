[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "graphdml"
version = "0.2.0"
description = "Causal effects on networks with double machine learning: ATE, direct and peer effects with confidence intervals that account for network dependence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sam Dreyfuss" }]
keywords = [
    "causal inference",
    "double machine learning",
    "networks",
    "interference",
    "spillover",
    "peer effects",
    "neo4j",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.14"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
validation = ["statsmodels>=0.14", "doubleml>=0.9", "joblib>=1.3", "tabulate>=0.9"]
dev = [
    "graphdml[neo4j]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "graphdml[validation]",
]

[project.urls]
Homepage = "https://github.com/Samrdreyfuss/graphdml"
Documentation = "https://samrdreyfuss.github.io/graphdml/"
Source = "https://github.com/Samrdreyfuss/graphdml"
Issues = "https://github.com/Samrdreyfuss/graphdml/issues"
Changelog = "https://github.com/Samrdreyfuss/graphdml/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/graphdml"]

[tool.hatch.build.targets.sdist]
exclude = ["benchmarks/results/*.csv", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: Monte Carlo validation gates (run with `pytest -m slow`)",
]
filterwarnings = ["ignore::graphdml.exceptions.GraphDMLWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
