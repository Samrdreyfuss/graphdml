name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch breakage from new dependency releases
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: pyproject.toml
      - run: uvx ruff check .

  docs:
    # Catches broken links and API-docs errors before they reach the published site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install -e ".[docs]"
      - run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            deps: "minimum"
          - python: "3.13"
            deps: "latest"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          cache-dependency-glob: pyproject.toml
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          if [ "${{ matrix.deps }}" = "minimum" ]; then
            uv pip install --resolution lowest-direct -e ".[dev]"
          else
            uv pip install -e ".[dev]"
          fi
      - run: python -m pytest

  validation-gate:
    # Monte Carlo coverage gate (docs/validation.md); slower, so not on every push.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          cache-dependency-glob: pyproject.toml
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest -m slow

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        # Pulled through Google's Docker Hub mirror: Docker Hub rate-limits anonymous pulls
        # from shared CI runners, which made this job fail at random.
        image: mirror.gcr.io/library/neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/graphdml-ci
          NEO4J_PLUGINS: '["graph-data-science"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          cache-dependency-glob: pyproject.toml
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest tests/test_neo4j.py
        env:
          GRAPHDML_NEO4J_URI: bolt://localhost:7687
          GRAPHDML_NEO4J_PASSWORD: graphdml-ci
